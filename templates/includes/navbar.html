
<!-- ========================================
     NAVIGATION LYMAO — VERSION CORRIGÉE
     ======================================== -->

<nav class="navbar" id="navbar">
    <div class="nav-container">

        <!-- LOGO DE L'ÉCOLE -->
        <a href="{% url 'home' %}" class="nav-logo">
            <div class="logo-icon">
                <i class="fas fa-graduation-cap"></i>
            </div>

            <div class="logo-text">
                <span class="logo-main">LYMAO</span>
                <span class="logo-sub">
                    LYCEE MODERNE ALASSANE OUATTARA
                </span>
            </div>
        </a>

        <!-- BOUTON MENU MOBILE : UN SEUL -->
        <button
            type="button"
            class="nav-toggle"
            id="navToggle"
            aria-label="Ouvrir le menu"
            aria-controls="navMenu"
            aria-expanded="false"
        >
            <span class="hamburger"></span>
            <span class="hamburger"></span>
            <span class="hamburger"></span>
        </button>

        <!-- LIENS DE NAVIGATION -->
        <ul class="nav-menu" id="navMenu">

            <!-- ACCUEIL -->
            <li class="nav-item">
                <a
                    href="{% url 'home' %}"
                    class="nav-link {% if request.path == '/' %}active{% endif %}"
                    {% if request.path == '/' %}aria-current="page"{% endif %}
                >
                    <i class="fas fa-home" aria-hidden="true"></i>
                    <span>Accueil</span>
                </a>
            </li>

            <!-- NOTRE ÉCOLE -->
            <li class="nav-item">
                <a
                    href="{% url 'apropos' %}"
                    class="nav-link {% if 'about' in request.path or 'apropos' in request.path %}active{% endif %}"
                    {% if 'about' in request.path or 'apropos' in request.path %}aria-current="page"{% endif %}
                >
                    <i class="fas fa-school" aria-hidden="true"></i>
                    <span>Notre École</span>
                </a>
            </li>

            <!-- ACTUALITÉS -->
            <li class="nav-item">
                <a
                    href="{% url 'liste_actualites' %}"
                    class="nav-link {% if 'actualite' in request.path %}active{% endif %}"
                    {% if 'actualite' in request.path %}aria-current="page"{% endif %}
                >
                    <i class="fas fa-newspaper" aria-hidden="true"></i>
                    <span>Actualités</span>
                </a>
            </li>

            <!-- CONTACT -->
            <li class="nav-item">
                <a
                    href="{% url 'contact' %}"
                    class="nav-link {% if 'contact' in request.path %}active{% endif %}"
                    {% if 'contact' in request.path %}aria-current="page"{% endif %}
                >
                    <i class="fas fa-envelope" aria-hidden="true"></i>
                    <span>Contact</span>
                </a>
            </li>

            <!-- ADMINISTRATION -->
            <li class="nav-item nav-cta">
                <a
                    href="{% url 'admin:index' %}"
                    class="btn btn-nav admin-link"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    <i class="fas fa-lock" aria-hidden="true"></i>
                    <span>Administration</span>
                </a>
            </li>

        </ul>
    </div>
</nav>

<!-- UN SEUL FOND SOMBRE POUR LE MENU MOBILE -->
<div
    class="nav-overlay"
    id="navOverlay"
    aria-hidden="true"
></div>
