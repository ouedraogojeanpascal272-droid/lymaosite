{% extends 'base.html' %}
{% load static %}

{% block title %}Galerie — Lycée Moderne Alassane Ouattara{% endblock %}

{% block extra_head %}
<style>
    .gallery-section { padding: 60px 0 100px; background: #f8fafc; }

    .gallery-filters {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-bottom: 40px;
    }

    .filter-btn {
        min-height: 44px;
        padding: 10px 22px;
        background: #ffffff;
        border: 2px solid #e2e8f0;
        border-radius: 30px;
        font-family: inherit;
        font-size: 0.9rem;
        font-weight: 600;
        color: #64748b;
        cursor: pointer;
        transition: border-color 0.25s ease, color 0.25s ease, background-color 0.25s ease;
    }
