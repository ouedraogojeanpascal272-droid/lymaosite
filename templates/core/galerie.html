                    <a href="https://www.youtube.com/embed/IDENTIFIANT" class="gallery-link video-link" data-title="Titre de la vidéo">
                        <img src="{% static 'images/mr-yao-prov.jpg' %}" alt="Aperçu de la vidéo : titre" loading="lazy">
                        <span class="gallery-overlay" aria-hidden="true"><i class="fas fa-play-circle"></i></span>
                    </a>
                    <figcaption class="gallery-caption">Titre de la vidéo</figcaption>
                </figure>
            {% endcomment %}

        </div>
    </div>
</section>
