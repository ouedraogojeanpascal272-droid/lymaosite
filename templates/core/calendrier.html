<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier Scolaire Officiel 2026-2027 – LYMAO</title>
    <style>
        :root {
            --primary: #1a5f3a;       /* Vert institutionnel (couleur MENA) */
            --primary-dark: #0f3d24;
            --accent: #e87722;        /* Orange officiel ivoirien */
            --bg-light: #f8faf9;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --warning-bg: #fffbeb;
            --warning-text: #92400e;
            --success-bg: #ecfdf5;
            --success-text: #065f46;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-light);
            color: var(--text-main);
            line-height: 1.6;
            padding: 2rem 1rem;
        }

        .container { max-width: 1200px; margin: 0 auto; }
