<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscriptions terminées – LYMAO</title>
    <style>
        /* Reset et base pour un rendu parfait */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            color: #2c3e50;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* Conteneur principal centré */
        .closed-container {
            background: #ffffff;
            max-width: 600px;
            width: 100%;
            padding: 3.5rem 2.5rem;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(44, 62, 80, 0.08);
            border-top: 5px solid #e67e22;
            animation: fadeInUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        /* Animation d'apparition fluide */
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Icône animée */
        .icon-wrapper {
            width: 80px;
            height: 80px;
            background: #fef3e2;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem auto;
            animation: pulse 3s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(230, 126, 34, 0.2); }
            50% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(230, 126, 34, 0); }
        }

        .icon-wrapper svg {
            width: 40px;
            height: 40px;
            stroke: #e67e22;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Typographie */
        .closed-container h1 {
            font-size: 2rem;
            font-weight: 800;
            color: #2c3e50;
            margin-bottom: 1rem;
            letter-spacing: -0.5px;
        }

        .closed-container p {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #5a6b7c;
            margin-bottom: 2rem;
        }

        .closed-container p strong {
            color: #2c3e50;
            font-weight: 600;
        }

        /* Bouton d'action */
        .btn-contact {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #2c3e50;
            color: #ffffff;
            text-decoration: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(44, 62, 80, 0.2);
        }

        .btn-contact:hover {
            background: #e67e22;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(230, 126, 34, 0.3);
        }

        .btn-contact svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
        }

        /* Responsive mobile */
        @media (max-width: 480px) {
            .closed-container {
                padding: 2.5rem 1.5rem;
            }
            .closed-container h1 {
                font-size: 1.6rem;
            }
            .closed-container p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div class="closed-container">
        <!-- Icône Calendrier + Check -->
        <div class="icon-wrapper">
            <svg viewBox="0 0 24 24">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
                <polyline points="9 16 11 18 15 14"></polyline>
            </svg>
        </div>

        <h1>Inscriptions terminées</h1>
        
        <p>
            Les inscriptions pour l'année scolaire <strong>2026-2027</strong> sont closes.<br>
            Le secrétariat reste à votre disposition pour toute question administrative exceptionnelle.
        </p>

        <a href="/contact/" class="btn-contact">
            <svg viewBox="0 0 24 24">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            Contacter le secrétariat
        </a>
    </div>

</body>
</html>
