    {% block extra_head %}{% endblock %}
</head>
<body>
    <a class="skip-link" href="#contenu">Aller au contenu</a>

    {% include 'includes/navbar.html' %}

    <main id="contenu">
        {% block content %}{% endblock %}
    </main>

    {% include 'includes/footer.html' %}

    <!-- Scripts -->
    <!-- onload : signale à style.css que AOS est chargé (sinon le contenu reste visible) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js" onload="document.documentElement.classList.add('aos-ready')"></script>
    <script src="{% static 'js/main.js' %}"></script>

    {% block extra_js %}{% endblock %}

    <script>
        // Initialisation seulement si AOS est disponible
        if (window.AOS) {
            AOS.init({
                duration: 800,
                once: true,
            });
        }
    </script>
</body>
</html>
