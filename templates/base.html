{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{% block meta_description %}Lycée Moderne Alassane Ouattara d'Anyama (LYMAO) : pédagogie, vie scolaire, actualités et informations pratiques pour les familles.{% endblock %}" />
    <title>{% block title %}LYMAO — Lycée Moderne Alassane Ouattara d'Anyama{% endblock %}</title>

    <!-- Icônes : chargées une seule fois (la feuille de style ne doit plus les importer) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" referrerpolicy="no-referrer" />
    <!-- Animations au défilement -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" referrerpolicy="no-referrer" />
    <!-- Feuille de style du site -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />

    {% block extra_head %}{% endblock %}
</head>
<body>
    <a class="skip-link" href="#contenu">Aller au contenu</a>

    {% include 'includes/navbar.html' %}

    <main id="contenu">
        {% block content %}{% endblock %}
    </main>

    {% include 'includes/footer.html' %}

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js" referrerpolicy="no-referrer"></script>
    <script src="{% static 'js/main.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
